devices:

  - hostname: R1

    management:
      ip: 192.168.1.1
      protocol: ssh
      port: 22

    platform:
      vendor: Cisco
      device_type: router
      os: IOS-XE

    interfaces:

      - name: GigabitEthernet0/0
        ip_address: 10.0.0.1
        status: up

      - name: GigabitEthernet0/1
        ip_address: 192.168.1.1
        status: up

  - hostname: R2

    management:
      ip: 192.168.1.2
      protocol: ssh
      port: 22

    platform:
      vendor: Cisco
      device_type: router
      os: IOS-XE

    interfaces:

      - name: GigabitEthernet0/0
        ip_address: 10.0.0.2
        status: up

      - name: GigabitEthernet0/1
        ip_address: 192.168.2.1
        status: down
